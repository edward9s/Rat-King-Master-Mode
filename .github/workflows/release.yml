name: Release RKA Mod

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # 台灣時間下午兩點 (UTC 06:00)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve Versions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="TrashboxBobylev/Rat-King-Adventure"

          UPSTREAM_RELEASE_TAG=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name // empty')
          if [ -z "$UPSTREAM_RELEASE_TAG" ]; then
            echo "::error::Unable to resolve the latest RKA release tag."
            exit 1
          fi

          SOURCE_REF="$UPSTREAM_RELEASE_TAG"
          SOURCE_BUILD_GRADLE=$(gh api             -H "Accept: application/vnd.github.raw"             "repos/$REPO/contents/build.gradle?ref=$SOURCE_REF")

          SOURCE_VERSION=$(printf '%s\n' "$SOURCE_BUILD_GRADLE"             | sed -nE "s/^[[:space:]]*appVersionName[[:space:]]*=[[:space:]]*'([^']+)'.*/\1/p"             | head -n 1)
          SOURCE_VERSION_CODE=$(printf '%s\n' "$SOURCE_BUILD_GRADLE"             | sed -nE 's/^[[:space:]]*appVersionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p'             | head -n 1)

          if [ -z "$SOURCE_VERSION" ] || [ -z "$SOURCE_VERSION_CODE" ]; then
            echo "::error::Unable to resolve RKA source version from build.gradle at $SOURCE_REF."
            exit 1
          fi

          if [ "$SOURCE_VERSION" != "$UPSTREAM_RELEASE_TAG" ]; then
            echo "::warning::RKA binary release is $UPSTREAM_RELEASE_TAG, but public source at ref $SOURCE_REF declares $SOURCE_VERSION (versionCode $SOURCE_VERSION_CODE). Source build will remain on $SOURCE_VERSION."
          fi

          SMM_REPO="edward9s/Shattered-Master-Mode"
          SMM_TAG=$(gh api "repos/$SMM_REPO/releases/latest" --jq '.tag_name // empty')
          if [ -z "$SMM_TAG" ]; then
            echo "::error::Unable to resolve the latest SMM release tag."
            exit 1
          fi
          if [[ ! "$SMM_TAG" =~ -m([0-9]+(\.[0-9]+)*)$ ]]; then
            echo "::error::Unexpected SMM release tag format: $SMM_TAG"
            exit 1
          fi
          MOD_VER="${BASH_REMATCH[1]}"

          EXPECTED_TAG="RKA-${SOURCE_VERSION}-m${MOD_VER}"

          STATUS=$(curl -sS -o /tmp/rka-release.json -w "%{http_code}"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/releases/tags/$EXPECTED_TAG")

          case "$STATUS" in
            200)
              if [ "${{ github.event_name }}" = "schedule" ]; then
                echo "Release $EXPECTED_TAG exists. Skipping scheduled source release."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Release $EXPECTED_TAG already exists; manual run will rebuild and update it."
              ;;
            404)
              ;;
            *)
              echo "::error::Unable to verify release status for $EXPECTED_TAG (GitHub API HTTP $STATUS)."
              cat /tmp/rka-release.json >&2 || true
              exit 1
              ;;
          esac

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_RELEASE_TAG=$UPSTREAM_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION=$SOURCE_VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_VERSION_CODE=$SOURCE_VERSION_CODE" >> "$GITHUB_ENV"
          echo "MOD_VER=$MOD_VER" >> "$GITHUB_ENV"
          echo "SMM_TAG=$SMM_TAG" >> "$GITHUB_ENV"
          echo "EXPECTED_TAG=$EXPECTED_TAG" >> "$GITHUB_ENV"
          echo "UPSTREAM_REPO=$REPO" >> "$GITHUB_ENV"

          echo "Resolved source release: $EXPECTED_TAG"
          echo "Latest RKA binary release: $UPSTREAM_RELEASE_TAG"
          echo "RKA source: $SOURCE_VERSION (versionCode $SOURCE_VERSION_CODE) from $SOURCE_REF"

      - name: Checkout SMM Source
        uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'
        with:
          repository: edward9s/Shattered-Master-Mode
          ref: ${{ env.SMM_TAG }}
          path: mod

      - name: Checkout RKA Source
        uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: spd_src

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        if: steps.check.outputs.skip == 'false'

      - name: Patch & Merge
        if: steps.check.outputs.skip == 'false'
        run: |
          # Detect the target SPD-family package and rebase SMM source consistently.
          python mod/scripts/rebase_source.py spd_src mod
          python mod/scripts/patch_android.py spd_src
          python mod/scripts/inject_mod.py spd_src

          # 修正 RKA 缺少 Sheep.initialize 方法造成的編譯中斷
          sed -i 's/((Sheep) mob)\.initialize(8.0f);/\/\/ RKA 相容性移除/g' mod/core/src/main/java/com/spd/mod/journal/ModCellSelector.java

          # RKA 會把 ChampionEnemy.color 套到英雄外觀；Instant Kill 不需要角色染色
          sed -i 's/color = 0xB06CFF;/color = 0xFFFFFF;/' mod/core/src/main/java/com/spd/mod/mechanics/ModInstantKill.java
          
          # 複製 Mod 檔案至 RKA 原始碼目錄
          cp -a mod/core spd_src/ 2>/dev/null || true
          cp -a mod/android spd_src/ 2>/dev/null || true
          cp -a mod/desktop spd_src/ 2>/dev/null || true
          cp -a mod/assets spd_src/ 2>/dev/null || true
          
          python mod/scripts/patch_depth.py 26
          
          # 預防編譯遺失 Google 服務 ID 的報錯
          mkdir -p spd_src/android/src/main/res/values
          cat <<EOF > spd_src/android/src/main/res/values/secrets.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="game_services_project_id">000000000000</string>
          </resources>
          EOF

          # 將硬編碼路徑與簽名設定註解化，避免破壞大括號結構
          sed -i 's/storeFile.*/\/\/ storeFile disabled/g' spd_src/android/build.gradle
          sed -i 's/signingConfig\s\+.*/\/\/ signingConfig disabled/g' spd_src/android/build.gradle

      - name: Compile
        if: steps.check.outputs.skip == 'false'
        working-directory: ./spd_src
        run: |
          chmod +x ./gradlew
          ./gradlew android:assembleRelease :desktop:release

      - name: Install Old Build Tools for Signer
        if: steps.check.outputs.skip == 'false'
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Sign Android
        if: steps.check.outputs.skip == 'false'
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: spd_src/android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Package
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p out
          
          APK_NAME="${{ env.EXPECTED_TAG }}-Android.apk"
          JAR_NAME="${{ env.EXPECTED_TAG }}-Java.jar"
          
          cp "${{ steps.sign.outputs.signedReleaseFile }}" "out/$APK_NAME"
          
          COMPILED_JAR=$(find spd_src/desktop/build/libs -name "desktop-*.jar" | head -n 1)
          if [ -n "$COMPILED_JAR" ]; then
            cp "$COMPILED_JAR" "out/$JAR_NAME"
          else
            echo "Error: Compiled desktop JAR not found"
            exit 1
          fi

      - name: Create or update Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EXPECTED_TAG }}
          name: ${{ env.EXPECTED_TAG }}
          body: |
            Source-built from Rat King Adventure ${{ env.SOURCE_VERSION }} (versionCode ${{ env.SOURCE_VERSION_CODE }}) at upstream ref ${{ env.SOURCE_REF }}, with Shattered Master Mode m${{ env.MOD_VER }}.
            Latest upstream RKA binary release observed during this build: ${{ env.UPSTREAM_RELEASE_TAG }}.
          files: out/*
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
